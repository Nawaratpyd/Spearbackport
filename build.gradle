plugins {
    id 'java-library'
    // ถ้าโปรเจกต์ Distance Leveling ของคุณ build ผ่านแล้ว ให้ใช้เลขเวอร์ชันเดียวกับที่นั่น
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.spearbackport'

base {
    archivesName = 'spearbackport'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    // ถ้าโปรเจกต์ Distance Leveling ของคุณ build ผ่านแล้ว ให้ใช้เลขเวอร์ชันเดียวกับที่นั่น
    version = '21.1.265'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        spearbackport {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
